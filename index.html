<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentEval</title>
<script>try{if(localStorage.getItem('agenteval_lang')==='en'){var d=document.documentElement;d.setAttribute('dir','ltr');d.setAttribute('lang','en');}}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Assistant:wght@300;400;500;600;700&family=Rubik:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FCFBF8;
    --bg-hi:#FFFFFF;
    --bg-lo:#F1EADB;
    --card:#EFE7D5;
    --ink:#1B2A47;
    --ink-2:#22345A;
    --rule:#D8C8AB;
    --accent:#2E4E86;
    --accent-dim:#3C568A;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{height:100%;}

  body{
    background-color:var(--bg);
    background-image:linear-gradient(176deg, var(--bg-hi) 0%, var(--bg) 42%, var(--bg-lo) 100%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Assistant',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
    position:relative;
  }

  /* subtle paper grain backdrop */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/></svg>");
    opacity:.06;
    mix-blend-mode:multiply;
    pointer-events:none;
    z-index:0;
  }

  body::after{
    content:"";
    position:fixed;
    inset:0;
    background:radial-gradient(circle at 50% 28%, transparent 0%, transparent 40%, rgba(20,28,50,.05) 100%);
    pointer-events:none;
    z-index:0;
  }

  .wrap{
    position:relative;
    z-index:1;
    max-width:920px;
    width:100%;
    margin:0 auto;
    padding:24px;
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }

  header{
    text-align:center;
    margin-bottom:clamp(36px, 7vh, 64px);
    opacity:0;
    animation:riseIn .7s ease forwards;
  }

  h1{
    font-family:'Frank Ruhl Libre', serif;
    font-weight:900;
    font-size:clamp(40px, 7vw, 64px);
    letter-spacing:.01em;
    color:var(--ink);
  }

  .sub{
    margin:18px auto 0;
    max-width:48ch;
    font-family:'Rubik', 'Assistant', sans-serif;
    font-weight:500;
    font-size:17.5px;
    line-height:1.8;
    letter-spacing:-.01em;
    color:var(--ink);
    text-align:start;
  }
  /* nudge the subtitle toward the reading edge, only where there is slack beside it */
  @media (min-width:600px){
    :root[dir="rtl"] .sub{ transform:translateX(clamp(32px, 6vw, 96px)); }
    :root[dir="ltr"] .sub{ transform:translateX(calc(-1 * clamp(32px, 6vw, 96px))); }
  }

  nav.index{
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .doc-row{
    opacity:0;
    animation:riseIn .6s ease forwards;
  }
  .doc-row:nth-child(1){animation-delay:.15s}
  .doc-row:nth-child(2){animation-delay:.25s}
  .doc-row:nth-child(3){animation-delay:.35s}
  .doc-row:nth-child(4){animation-delay:.45s}
  .doc-row:nth-child(5){animation-delay:.55s}

  .doc-row a{
    text-decoration:none;
    color:inherit;
    display:grid;
    grid-template-columns:1fr auto;
    align-items:center;
    gap:20px;
    padding:26px 34px;
    position:relative;
    background:var(--card);
    border:1px solid rgba(20,28,50,.12);
    border-radius:16px;
    box-shadow:0 2px 6px rgba(20,28,50,.06);
    transition:transform .3s cubic-bezier(.22,1,.36,1),
               box-shadow .3s ease,
               border-color .3s ease,
               background-color .3s ease;
  }

  .doc-row a:hover,
  .doc-row a:focus-visible{
    transform:translateY(-4px);
    background-color:var(--ink);
    border-color:var(--ink);
    box-shadow:0 18px 34px rgba(20,28,50,.20);
  }

  .doc-row a:active{
    transform:translateY(-1px);
  }

  .doc-row a:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:4px;
  }

  .num{
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    color:var(--accent-dim);
    letter-spacing:.05em;
    transition:color .35s ease;
  }
  .doc-row a:hover .num,
  .doc-row a:focus-visible .num{
    color:var(--accent);
  }

  .doc-title-block .title{
    font-family:'Frank Ruhl Libre', serif;
    font-weight:700;
    font-size:clamp(22px, 3.2vw, 30px);
    color:var(--ink);
    transition:color .3s ease;
  }
  .doc-row a:hover .title,
  .doc-row a:focus-visible .title{
    color:var(--bg);
  }
  .doc-title-block .desc{
    margin-top:6px;
    font-size:14.5px;
    color:#5A6B88;
    max-width:46ch;
  }

  .arrow{
    font-family:'JetBrains Mono', monospace;
    font-size:20px;
    color:var(--accent);
    transition:transform .3s cubic-bezier(.22,1,.36,1), color .3s ease;
  }
  .doc-row a:hover .arrow,
  .doc-row a:focus-visible .arrow{
    transform:translateX(6px);
    color:#AEC1E4;
  }

  @keyframes riseIn{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }

  @media (prefers-reduced-motion: reduce){
    .doc-row{animation:none !important; opacity:1 !important; transform:none !important;}
    .doc-row a, .arrow, .num{transition:none !important;}
  }

  @media (max-width:560px){
    .doc-row a{
      grid-template-columns:1fr;
      gap:6px;
      padding:22px 22px 22px 26px;
    }
    .arrow{display:none;}
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 dir="ltr">AgentEval</h1>
      <p class="sub" data-i18n="index.sub">סוכן AI שמדמה לקוחות אמיתיים לבדיקה, ניטור וייעול של צ'אטבוטים.<br>בפרויקט בוט של חברת אשראי עם אפשרות בדיקה ידנית / אוטומטית</p>
    </header>

    <nav class="index" dir="ltr">
      <div class="doc-row">
        <a href="problem.html">
          <span class="doc-title-block">
            <span class="title">The problem</span>
          </span>
          <span class="arrow">→</span>
        </a>
      </div>
      <div class="doc-row">
        <a href="https://www.clearcard.online/" target="_blank" rel="noopener noreferrer">
          <span class="doc-title-block">
            <span class="title">Live Demo</span>
          </span>
          <span class="arrow">→</span>
        </a>
      </div>
      <div class="doc-row">
        <a href="prd.html">
          <span class="doc-title-block">
            <span class="title">PRD</span>
          </span>
          <span class="arrow">→</span>
        </a>
      </div>
      <div class="doc-row">
        <a href="research.html">
          <span class="doc-title-block">
            <span class="title">Research</span>
          </span>
          <span class="arrow">→</span>
        </a>
      </div>
      <div class="doc-row">
        <a href="about.html">
          <span class="doc-title-block">
            <span class="title">About Me</span>
          </span>
          <span class="arrow">→</span>
        </a>
      </div>
    </nav>
  </div>
<script src="i18n.js" defer></script>
</body>
</html>
