<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentEval</title>
<script>try{if(localStorage.getItem('agenteval_lang')==='en'){var d=document.documentElement;d.setAttribute('dir','ltr');d.setAttribute('lang','en');var s=document.createElement('style');s.id='i18n-cloak';s.textContent='[data-i18n],[data-i18n-scope]{visibility:hidden}';(document.head||d).appendChild(s);setTimeout(function(){var c=document.getElementById('i18n-cloak');if(c&&c.parentNode)c.parentNode.removeChild(c);},1500);}}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2f3f9;
    --bg-hi:#fbfbfe;
    --bg-lo:#ebecf5;
    --card:#ffffff;
    --panel-2:#fbfbfe;
    --brand-light:#c7cfff;
    --ink:#12162a;
    --ink-2:#454e66;
    --rule:#e6e6f2;
    --accent:#8a93f0;
    --accent-dim:#6b7386;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{height:100%;}

  body{
    background-color:var(--bg);
    background-image:linear-gradient(176deg, var(--bg-hi) 0%, var(--bg) 42%, var(--bg-lo) 100%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'IBM Plex Sans Hebrew', 'Archivo', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
    position:relative;
  }

  /* subtle paper grain backdrop */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/></svg>");
    opacity:.035;
    mix-blend-mode:multiply;
    pointer-events:none;
    z-index:0;
  }

  body::after{
    content:"";
    position:fixed;
    inset:0;
    background:radial-gradient(circle at 50% 28%, transparent 0%, transparent 40%, rgba(18,22,42,.04) 100%);
    pointer-events:none;
    z-index:0;
  }

  .wrap{
    position:relative;
    z-index:1;
    max-width:920px;
    width:100%;
    margin:0 auto;
    padding:24px;
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }

  header{
    text-align:center;
    margin-bottom:clamp(36px, 7vh, 64px);
    opacity:0;
    animation:riseIn .7s ease forwards;
  }

  h1{
    font-family:'Archivo', 'IBM Plex Sans Hebrew', sans-serif;
    font-weight:800;
    font-size:clamp(40px, 7vw, 64px);
    letter-spacing:.01em;
    color:var(--ink);
  }

  .sub{
    margin:18px auto 0;
    max-width:48ch;
    font-family:'IBM Plex Sans Hebrew', 'Archivo', sans-serif;
    font-weight:500;
    font-size:17.5px;
    line-height:1.8;
    letter-spacing:-.01em;
    color:var(--ink);
    text-align:center;
    text-wrap:balance;
  }
  /* English reads left-to-right: left-align it so every line shares one edge,
     and drop the width cap so each sentence stays on its own line where it fits */
  :root[dir="ltr"] .sub{ text-align:left; max-width:none; text-wrap:wrap; }

  nav.index{
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .doc-row{
    opacity:0;
    animation:riseIn .6s ease forwards;
  }
  .doc-row:nth-child(1){animation-delay:.15s}
  .doc-row:nth-child(2){animation-delay:.25s}
  .doc-row:nth-child(3){animation-delay:.35s}
  .doc-row:nth-child(4){animation-delay:.45s}
  .doc-row:nth-child(5){animation-delay:.55s}

  .doc-row a{
    text-decoration:none;
    color:inherit;
    display:grid;
    grid-template-columns:1fr auto;
    align-items:center;
    gap:20px;
    padding:24px 32px;
    position:relative;
    background:var(--card);
    border:1px solid transparent;
    border-radius:12px;
    box-shadow:0 1px 2px rgba(18,22,42,.04), 0 12px 24px rgba(18,22,42,.07);
    transition:all .2s cubic-bezier(.4,0,.2,1);
  }

  .doc-row a:hover,
  .doc-row a:focus-visible{
    transform:translateY(-2px);
    background-color:var(--brand-light);
    border-color:var(--accent);
    box-shadow:0 1px 2px rgba(18,22,42,.04), 0 14px 30px rgba(138,147,240,.28);
  }

  .doc-row a:active{
    transform:translateY(-1px);
  }

  .doc-row a:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:4px;
  }

  .num{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--accent-dim);
    letter-spacing:.05em;
    transition:color .35s ease;
  }
  .doc-row a:hover .num,
  .doc-row a:focus-visible .num{
    color:var(--accent);
  }

  .doc-title-block .title{
    font-family:'Archivo', 'IBM Plex Sans Hebrew', sans-serif;
    font-weight:700;
    font-size:clamp(22px, 3.2vw, 30px);
    color:var(--ink);
    transition:color .3s ease;
  }
  .doc-row a:hover .title,
  .doc-row a:focus-visible .title{
    color:var(--ink);
  }
  .doc-title-block .desc{
    margin-top:6px;
    font-size:14.5px;
    color:#6b7386;
    max-width:46ch;
  }

  .arrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:20px;
    color:var(--accent);
    transition:transform .3s cubic-bezier(.22,1,.36,1), color .3s ease;
  }
  .doc-row a:hover .arrow,
  .doc-row a:focus-visible .arrow{
    transform:translateX(6px);
    color:var(--accent);
  }

  @keyframes riseIn{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }

  @media (prefers-reduced-motion: reduce){
    .doc-row{animation:none !important; opacity:1 !important; transform:none !important;}
    .doc-row a, .arrow, .num{transition:none !important;}
  }

  @media (max-width:560px){
    .doc-row a{
      grid-template-columns:1fr;
      gap:8px;
      padding:20px 20px 20px 24px;
    }
    .arrow{display:none;}
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 dir="ltr">AgentEval</h1>
      <p class="sub" data-i18n="index.sub">סוכן AI שמדמה לקוחות אמיתיים לבדיקה, ניטור וייעול של צ'אטבוטים.<br>בפרויקט בוט של חברת אשראי עם אפשרות בדיקה ידנית&nbsp;/&nbsp;אוטומטית</p>
    </header>

    <nav class="index" dir="ltr">
      <div class="doc-row">
        <a href="problem.html">
          <span class="doc-title-block">
            <span class="title">The problem</span>
          </span>
          <span class="arrow">→</span>
        </a>
      </div>
      <div class="doc-row">
        <a href="https://www.clearcard.online/" target="_blank" rel="noopener noreferrer">
          <span class="doc-title-block">
            <span class="title">Live Demo</span>
          </span>
          <span class="arrow">→</span>
        </a>
      </div>
      <div class="doc-row">
        <a href="prd.html">
          <span class="doc-title-block">
            <span class="title">PRD</span>
          </span>
          <span class="arrow">→</span>
        </a>
      </div>
      <div class="doc-row">
        <a href="research.html">
          <span class="doc-title-block">
            <span class="title">Research</span>
          </span>
          <span class="arrow">→</span>
        </a>
      </div>
      <div class="doc-row">
        <a href="about.html">
          <span class="doc-title-block">
            <span class="title">About Me</span>
          </span>
          <span class="arrow">→</span>
        </a>
      </div>
    </nav>
  </div>
<script src="i18n.js" defer></script>
</body>
</html>
